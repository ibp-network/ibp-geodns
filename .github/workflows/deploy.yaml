name: Deploy GeoDNS
run-name: ${{ inputs.organization }} deploys geodns ${{ inputs.version }}

on:
  workflow_dispatch:
    inputs:
      organization:
        description: 'Organization'
        required: true
        type: choice
        options:
          - ROTKO
          - STAKEPLUS
      server:
        description: 'Target server'
        required: true
      version:
        description: 'Git ref to deploy (tag/branch/commit)'
        required: true
        default: 'main'
      restart_services:
        description: 'Restart services after deploy'
        required: true
        type: boolean
        default: true
  workflow_call:
    inputs:
      organization:
        required: true
        type: string
      server:
        required: true
        type: string
      version:
        required: true
        type: string
        default: 'main'
      restart_services:
        required: true
        type: boolean
        default: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
      with:
        ref: ${{ inputs.version }}

    - uses: actions/setup-go@v6
      with:
        go-version: '1.24'

    - name: Build
      run: |
        set -o errexit -o nounset -o pipefail
        go mod download
        go mod verify
        export SOURCE_DATE_EPOCH=$(git log -1 --pretty=%ct)
        # output binary name matches Tom's /opt/ibp-geodns/bin/ibp-dns
        CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build \
          -trimpath -ldflags="-s -w -buildid=" \
          -o ibp-dns src/IBPDns.go
        sha256sum ibp-dns > checksums.txt

    - name: Deploy
      env:
        DEPLOY_KEY_NAME:        DEPLOY_KEY_${{ inputs.organization }}
        MAXMIND_ACCT_NAME:      MAXMIND_ACCOUNT_ID_${{ inputs.organization }}
        MAXMIND_KEY_NAME:       MAXMIND_LICENSE_KEY_${{ inputs.organization }}
        NATS_URL_NAME:          NATS_URL_${{ inputs.organization }}
        NATS_USER_NAME:         NATS_USER_${{ inputs.organization }}
        NATS_PASS_NAME:         NATS_PASS_${{ inputs.organization }}
        MONITOR_URL_NAME:       MONITOR_URL_${{ inputs.organization }}
      run: |
        set -o errexit -o nounset -o pipefail

        version="${{ inputs.version }}"
        if [[ "$version" == "main" ]] || [[ "$version" == "master" ]]; then
          version="$(git rev-parse --short HEAD)"
        fi
        echo "Deploying version: $version"

        # SSH setup
        mkdir -p ~/.ssh
        echo "${{ secrets[env.DEPLOY_KEY_NAME] }}" > ~/.ssh/id_ed25519
        chmod 600 ~/.ssh/id_ed25519
        ssh-keyscan -H ${{ inputs.server }} >> ~/.ssh/known_hosts

        # Stage + promote the binary in Tom's layout
        ssh ibp@${{ inputs.server }} "
          set -e
          mkdir -p /opt/ibp-geodns/.staging/$version
        "
        rsync --chmod=755 ibp-dns checksums.txt \
          ibp@${{ inputs.server }}:/opt/ibp-geodns/.staging/$version/

        ssh ibp@${{ inputs.server }} "
          set -e
          cd /opt/ibp-geodns
          cd .staging/$version
          sha256sum -c checksums.txt
          cd /opt/ibp-geodns

          # remember previous version for rollback
          if [[ -L bin/ibp-dns ]]; then
            readlink bin/ibp-dns | xargs dirname | xargs basename > .previous-version
          fi

          # promote
          mv .staging/$version $version
          ln -sfn ../$version/ibp-dns bin/ibp-dns.new
          mv -Tf bin/ibp-dns.new bin/ibp-dns
          echo 'ibp-dns deployed'
        "

        # Patch /etc/ibpdns/dns.json with per-org secrets (skip empty/PENDING)
        echo "Patching config secrets..."
        cat > /tmp/patch_config.py <<'PYEOF'
        import json, os, pathlib, sys, urllib.parse
        p = pathlib.Path("/etc/ibpdns/dns.json")
        c = json.loads(p.read_text())
        kv = dict(arg.split("=", 1) for arg in sys.argv[1:])
        def setv(section, key, val):
            if val and val != "PENDING_FROM_TOM":
                c.setdefault(section, {})[key] = val
        setv("Maxmind", "AccountID",  kv.get("MM_ACCT", ""))
        setv("Maxmind", "LicenseKey", kv.get("MM_KEY", ""))
        setv("Nats",    "Url",  kv.get("NATS_URL", ""))
        setv("Nats",    "User", kv.get("NATS_USER", ""))
        setv("Nats",    "Pass", kv.get("NATS_PASS", ""))
        mu = kv.get("MONITOR_URL", "")
        if mu and mu != "PENDING_FROM_TOM":
            u = mu if "://" in mu else "http://" + mu
            parsed = urllib.parse.urlparse(u)
            if parsed.hostname:
                c.setdefault("DnsApi", {})["MonitorAddress"] = parsed.hostname
            if parsed.port:
                c.setdefault("DnsApi", {})["MonitorPort"] = str(parsed.port)
        p.write_text(json.dumps(c, indent=2))
        print("dns.json patched")
        PYEOF
        scp /tmp/patch_config.py ibp@${{ inputs.server }}:/tmp/patch_config.py
        ssh ibp@${{ inputs.server }} python3 /tmp/patch_config.py \
          "MM_ACCT=${{ secrets[env.MAXMIND_ACCT_NAME] }}" \
          "MM_KEY=${{ secrets[env.MAXMIND_KEY_NAME] }}" \
          "NATS_URL=${{ secrets[env.NATS_URL_NAME] }}" \
          "NATS_USER=${{ secrets[env.NATS_USER_NAME] }}" \
          "NATS_PASS=${{ secrets[env.NATS_PASS_NAME] }}" \
          "MONITOR_URL=${{ secrets[env.MONITOR_URL_NAME] }}"

        # Restart services
        if [[ "${{ inputs.restart_services }}" == "true" ]]; then
          echo "Restarting services..."
          ssh ibp@${{ inputs.server }} "
            set -e
            sudo systemctl restart ibpdns
            for i in \$(seq 1 15); do
              state=\$(sudo systemctl is-active ibpdns || true)
              [[ \"\$state\" == active ]] && break
              sleep 2
            done
            sudo systemctl is-active ibpdns

            sudo systemctl restart pdns
            sleep 1
            sudo systemctl is-active pdns
          "
        fi

        echo "Deployment completed successfully!"

    - name: Rollback on failure
      if: failure() && inputs.restart_services
      env:
        DEPLOY_KEY_NAME: DEPLOY_KEY_${{ inputs.organization }}
      run: |
        echo "Deployment failed, attempting rollback..."
        ssh ibp@${{ inputs.server }} "
          set -e
          cd /opt/ibp-geodns
          if [[ -f .previous-version ]]; then
            prev=\$(cat .previous-version)
            echo \"Rolling back to: \$prev\"
            ln -sfn ../\$prev/ibp-dns bin/ibp-dns
            sudo systemctl restart ibpdns
            echo 'Rollback completed'
          else
            echo 'No previous version found for rollback'
          fi
        "
