name: Release ${{ github.ref_name }}
on:
  push:
    tags: ['v*']
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-go@v5
      with:
        go-version: '1.24'
    - name: Get dependencies
      run: go mod tidy
    - name: Build
      run: |
        set -o errexit -o nounset -o pipefail
        CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o IBPDns src/IBPDns/IBPDns.go
        CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o IBPMonitor src/IBPMonitor/IBPMonitor.go
        CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o IBPCollator src/IBPCollator/IBPCollator.go
        sha256sum IBPDns IBPMonitor IBPCollator > checksums.txt
    - name: Release
      uses: softprops/action-gh-release@v1
      with:
        files: |
          IBPDns
          IBPMonitor
          IBPCollator
          checksums.txt
