name: Release
on:
  push:
    tags: ['v*']
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - uses: actions/setup-go@v5
      with:
        go-version: '1.24'
    
    - name: Ensure go.sum is up to date and verify dependencies
      run: |
        go mod tidy
        go mod verify
    
    - name: Build all architectures
      run: |
        set -o errexit -o nounset -o pipefail
        
        export SOURCE_DATE_EPOCH=$(git log -1 --pretty=%ct)
        
        for arch in amd64 arm64; do
          echo "Building for linux/$arch..."
          
          CGO_ENABLED=0 GOOS=linux GOARCH=$arch go build \
            -trimpath -ldflags="-s -w -buildid=" \
            -o IBPDns-linux-$arch src/IBPDns.go
        done
        
        sha256sum IBPDns-* > checksums.txt
        
        for arch in amd64 arm64; do
          tar czf geodns-linux-$arch.tar.gz \
            IBPDns-linux-$arch \
            checksums.txt
        done
    
    - name: Release
      uses: softprops/action-gh-release@v1
      with:
        files: |
          geodns-linux-*.tar.gz
          IBPDns-linux-*
          checksums.txt
